<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>15 Xóm Lẻ</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="Cuộn để đi vào 15 Xóm Lẻ, tiệm streetwear cuối một con ngõ Hà Nội, dựng 3D bằng Three.js.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&display=swap">
</head>
<body>
  <!-- Cảnh 3D (hoặc chuỗi ảnh render) vẽ vào canvas này -->
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="shade"></div>

  <!-- Màn hình tải -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <canvas id="loaderBadge" width="240" height="312" aria-label="Logo 15 Xóm Lẻ"></canvas>
    <div class="bar"><i id="loadbar"></i></div>
    <span id="loadpct">0%</span>
  </div>

  <!-- Thành phần cố định trên màn hình -->
  <a class="brand" href="#dau-ngo"><span class="n">15</span>XÓM LẺ</a>
  <div class="meter" id="meter" aria-hidden="true">00%</div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <ul class="rail" id="rail" aria-label="Các góc trong tiệm"></ul>

  <!-- Đường cuộn: các <section> được tạo từ src/config/stations.js -->
  <main id="track"></main>

  <!-- Chi tiết sản phẩm: mở khi bấm vào món đồ hoặc chấm giá. Nội dung điền bằng src/ui/productDetail.js -->
  <div class="detail" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="dName">
    <header class="d-head">
      <p class="d-title" id="dZone"></p>
      <p class="d-sub" id="dSub"></p>
    </header>
    <div class="d-bar">
      <span class="d-count" id="dCount"></span>
      <span class="d-rail" aria-hidden="true"></span>
      <button class="d-close" id="dClose" type="button">Đóng
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9m0-9l-9 9"/></svg>
      </button>
    </div>
    <div class="d-body">
      <button class="d-nav prev" id="dPrev" type="button" aria-label="Món trước">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
      </button>
      <div class="d-stage">
        <div class="d-ghosts" id="dGhosts" aria-hidden="true"></div>
        <figure class="d-main" id="dMain">
          <img id="dImg" alt="">
          <div class="d-fallback" id="dFallback" hidden></div>
        </figure>
      </div>
      <div class="d-info" id="dInfo">
        <p class="d-kind" id="dKind"></p>
        <h2 class="d-name" id="dName"></h2>
        <span class="d-dash" aria-hidden="true"></span>
        <p class="d-price" id="dPrice"></p>
        <div class="d-views" id="dViews" role="group" aria-label="Các mặt của sản phẩm"></div>
        <dl class="d-specs" id="dSpecs"></dl>
        <p class="d-desc" id="dDesc"></p>
        <div class="d-actions">
          <a class="btn d-cta" id="dCta" target="_blank" rel="noopener" hidden>Nhắn tiệm giữ món này</a>
          <button class="d-back" id="dBack" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>Về cửa tiệm
          </button>
        </div>
      </div>
      <button class="d-nav next" id="dNext" type="button" aria-label="Món sau">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
